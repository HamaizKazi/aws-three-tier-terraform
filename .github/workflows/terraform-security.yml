name: Terraform static checks

on:
  push:
    branches:
      - main
      - feature/terraform-cicd-pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Install TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create report folder
        run: mkdir -p reports

      - name: Run TFLint and save report
        run: |
          set -o pipefail
          tflint --format compact 2>&1 | tee reports/tflint.txt

      - name: Upload TFLint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tflint-report
          path: reports/tflint.txt
          if-no-files-found: warn
          retention-days: 14

  checkov:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install checkov==3.3.30

      - name: Create report folder
        run: mkdir -p reports

      - name: Scan Terraform and save report
        run: |
          set -o pipefail
          checkov -d . --framework terraform 2>&1 | tee reports/checkov.txt

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-report
          path: reports/checkov.txt
          if-no-files-found: warn
          retention-days: 14

  trivy:
    name: Trivy security scans
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.68.2

      - name: Create report folder
        run: mkdir -p reports

      - name: Scan Terraform config and save report
        run: |
          set -o pipefail
          trivy config --severity HIGH,CRITICAL --exit-code 1 . 2>&1 |
            tee reports/trivy-config.txt

      - name: Scan for secrets and save report
        if: always()
        run: |
          set -o pipefail
          trivy fs --scanners secret --skip-dirs reports --exit-code 1 . 2>&1 |
            tee reports/trivy-secrets.txt

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-reports
          path: reports/trivy-*.txt
          if-no-files-found: warn
          retention-days: 14
